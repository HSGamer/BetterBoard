version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all safe patch/minor bumps, majors stay separate for review
      maven-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # MiniPlaceholders past 3.1.0 targets Java 25 (class version 69) and
      # cannot even compile on this repo's JDK 21 toolchain; lift the cap
      # only when the build moves to JDK 25+
      - dependency-name: "io.github.miniplaceholders:miniplaceholders-api"
        versions:
          - "> 3.1.0"
      # hscore-expression was discontinued after 4.5.7 and the hscore modules
      # must stay on a uniform version, so hold the whole set at 4.5.7
      - dependency-name: "me.hsgamer:*"
        versions:
          - "> 4.5.7"
      # paper-api tracks the supported Minecraft version; bumping it is a
      # functional change, so it stays manual and is never auto-updated
      - dependency-name: "io.papermc.paper:paper-api"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
